<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Matchbook</title>
<style>
  :root {
    --brand: oklch(0.58 0.22 355);
    --brand-deep: oklch(0.42 0.19 355);
    --bg: oklch(0.975 0.005 355);
    --surface: oklch(1 0 0);
    --ink: oklch(0.24 0.02 355);
    --muted: oklch(0.50 0.02 355);
    --line: oklch(0.90 0.01 355);
    --champagne: oklch(0.80 0.10 85);
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 430px;
    padding: 20px 20px 40px;
    animation: rise-in 380ms var(--ease-out-quart) both;
  }
  .photos {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    border-radius: 24px;
    -webkit-overflow-scrolling: touch;
  }
  .photos img {
    width: 100%;
    flex: none;
    aspect-ratio: 4/5;
    object-fit: cover;
    border-radius: 24px;
    box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.35);
    scroll-snap-align: center;
    background: var(--line);
  }
  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.02em;
    text-wrap: balance;
    margin-top: 20px;
  }
  h1 small {
    font-weight: 400;
    color: var(--muted);
    font-size: 21px;
    letter-spacing: normal;
  }
  .city { color: var(--muted); margin-top: 4px; font-size: 15px; }
  .pitch {
    margin-top: 18px;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.45;
    max-width: 70ch;
    position: relative;
    padding-left: 4px;
  }
  .pitch::before {
    content: '\201C';
    color: var(--brand);
    font-size: 1.3em;
    font-weight: 800;
    margin-right: 1px;
  }
  .pitch::after {
    content: '\201D \2014 their wingperson';
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
  }
  .prompt {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .prompt .q {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    color: var(--muted);
  }
  .prompt .a { margin-top: 4px; font-size: 17px; line-height: 1.45; }
  .looking { margin-top: 16px; color: var(--muted); font-size: 15px; }
  button {
    width: 100%;
    margin-top: 26px;
    min-height: 52px;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border: 0;
    border-radius: 16px;
    background: var(--brand);
    color: var(--surface);
    transition: transform 150ms var(--ease-out-quart), background 150ms var(--ease-out-quart);
  }
  button:active:not(:disabled) { transform: scale(0.98); background: var(--brand-deep); }
  button:disabled { opacity: 0.55; }
  .state {
    text-align: center;
    padding: 34dvh 30px 0;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.45;
    max-width: 430px;
    margin: 0 auto;
  }
  .hidden { display: none; }

  @keyframes rise-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: fade-in 1ms linear both; }
    button { transition: none; }
    button:active:not(:disabled) { transform: none; }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="card hidden" id="card">
  <div class="photos" id="photos"></div>
  <h1><span id="name"></span> <small id="age"></small></h1>
  <div class="city" id="city"></div>
  <div class="pitch" id="pitch"></div>
  <div id="prompts"></div>
  <div class="looking" id="looking"></div>
  <button id="sayhi">Say hi 👋</button>
</div>
<div class="state hidden" id="state"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = (id) => document.getElementById(id);
  const slug = location.pathname.split('/')[2] || '';
  const showState = (msg) => { $('state').textContent = msg; $('state').classList.remove('hidden'); };

  async function load() {
    const { data: p, error } = await sb.rpc('get_profile', { p_slug: slug });
    if (error) return showState('Something went wrong — try again in a minute.');
    if (!p) return showState("This link isn't active.");
    document.title = p.first_name + ' · Matchbook';
    for (const url of (p.photos || [])) {
      const img = document.createElement('img'); img.src = url; $('photos').appendChild(img);
    }
    $('name').textContent = p.first_name;
    $('age').textContent = p.age ? p.age : '';
    $('city').textContent = p.city || '';
    $('pitch').textContent = p.pitch || '';
    for (const pr of (p.prompts || [])) {
      const d = document.createElement('div'); d.className = 'prompt';
      const q = document.createElement('div'); q.className = 'q'; q.textContent = pr.q;
      const a = document.createElement('div'); a.className = 'a'; a.textContent = pr.a;
      d.append(q, a); $('prompts').appendChild(d);
    }
    if (p.looking_for) $('looking').textContent = 'Looking for: ' + p.looking_for;
    $('card').classList.remove('hidden');
  }

  $('sayhi').addEventListener('click', async () => {
    $('sayhi').disabled = true; $('sayhi').textContent = 'Opening chat…';
    const { data, error } = await sb.rpc('create_chat', { p_slug: slug });
    if (error || !data) { $('sayhi').disabled = false; $('sayhi').textContent = 'Say hi 👋'; return; }
    location.href = '/c/' + data.guest_token;
  });

  load();
</script>
</body>
</html>
